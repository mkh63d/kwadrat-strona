<style>
*{box-sizing:border-box}
body{margin:0;background:#070a1c;color:#f5f7ff;font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:#00e7fd}
:focus-visible{outline:3px solid #00e7fd;outline-offset:3px;border-radius:6px}
header{padding:20px clamp(16px,4vw,48px);border-bottom:1px solid rgba(255,255,255,.07)}
header img{width:clamp(160px,16vw,220px);height:auto;display:block}
main{max-width:1180px;margin:0 auto;padding:clamp(28px,5vw,64px) clamp(16px,4vw,48px) 80px;display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:clamp(28px,4vw,56px);align-items:start}
h1{grid-column:1/-1;margin:0;font-family:"Jost",sans-serif;font-weight:500;font-size:clamp(34px,4.4vw,60px);line-height:1;letter-spacing:-.03em}
.lead{grid-column:1/-1;margin:-20px 0 0;max-width:640px;color:#a9b3d6;font-size:18px;line-height:1.5}
form{display:flex;flex-direction:column;gap:20px}
label{display:flex;flex-direction:column;gap:8px;font-weight:800;font-size:15px}
.hint{font-weight:600;font-size:13px;color:#a9b3d6}
input[type=text]{min-height:50px;padding:0 16px;font:700 17px "Nunito",sans-serif;color:#f5f7ff;background:#10152f;border:1px solid rgba(255,255,255,.22);border-radius:12px}
input[type=text]:focus{border-color:#00e7fd}
input[type=file]{padding:12px;font:600 15px "Nunito",sans-serif;color:#dfe5ff;background:#10152f;border:1px dashed rgba(255,255,255,.35);border-radius:12px}
input[type=range]{width:100%;min-height:44px;accent-color:#00e7fd}
fieldset{margin:0;padding:0;border:0;display:flex;flex-direction:column;gap:4px}
fieldset:disabled{opacity:.45}
legend{padding:0;margin-bottom:6px;font-weight:800;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 26px;border:0;border-radius:12px;background:#00e7fd;color:#000;font:800 17px "Nunito",sans-serif;cursor:pointer;transition:transform 120ms ease,background-color 160ms ease}
.btn:hover{background:#7ff4ff}
.btn:active{transform:scale(.97)}
.preview{position:sticky;top:16px;display:flex;flex-direction:column;gap:14px}
canvas{width:100%;height:auto;aspect-ratio:1/1;display:block;border-radius:20px;background:#10152f;border:1px solid rgba(255,255,255,.12)}
.err{min-height:1.4em;margin:0;color:#ff9aa8;font-weight:700;font-size:14px}
@media (max-width:860px){main{grid-template-columns:minmax(0,1fr)}.preview{position:static;order:-1}.lead{margin-top:-12px}}
@media (prefers-reduced-motion:reduce){.btn,.btn:active{transition:none;transform:none}}
</style>

<header><a href="../" aria-label="Kwadrat Kreatywny, strona główna"><img src="../assets/logo.svg" alt="Kwadrat Kreatywny" width="220" height="22"></a></header>
<main>
<h1>Twój post prelegenta</h1>
<p class="lead">Wgraj zdjęcie, wpisz imię i firmę. Dostaniesz grafikę 1080×1080 do wrzucenia na LinkedIn. Zdjęcie zostaje w Twojej przeglądarce, nigdzie go nie wysyłamy.</p>

<form id="f" autocomplete="off" novalidate>
<label>Imię i nazwisko
<input type="text" id="name" maxlength="40" value="Imię Nazwisko">
</label>
<label>Firma lub projekt
<input type="text" id="company" maxlength="40" value="Nazwa firmy">
</label>
<label>Rola
<input type="text" id="role" maxlength="24" value="Prelegent">
<span class="hint">Na grafice: „Rola · Firma”.</span>
</label>
<label>Zdjęcie
<input type="file" id="photo" accept="image/png,image/jpeg,image/webp">
<span class="hint">JPG, PNG lub WebP, do 15 MB. Najlepiej pionowe, twarz na środku.</span>
</label>
<fieldset id="adjust" disabled>
<legend>Kadr zdjęcia</legend>
<label>Przybliżenie<input type="range" id="zoom" min="1" max="3" step="0.01" value="1"></label>
<label>W poziomie<input type="range" id="px" min="-1" max="1" step="0.01" value="0"></label>
<label>W pionie<input type="range" id="py" min="-1" max="1" step="0.01" value="0"></label>
</fieldset>
<p class="err" id="err" role="alert"></p>
</form>

<section class="preview" aria-label="Podgląd">
<canvas id="c" width="1080" height="1080" role="img" aria-label="Podgląd grafiki z postem prelegenta"></canvas>
<button class="btn" id="dl" type="button">Pobierz PNG</button>
</section>
</main>

function wrap(text,font,max){
ctx.font=font;
var words=text.split(/\s+/).filter(Boolean),lines=[],cur="";
words.forEach(function(w){var t=cur?cur+" "+w:w;if(ctx.measureText(t).width>max&&cur){lines.push(cur);cur=w}else cur=t});
if(cur)lines.push(cur);
return lines;
}

function draw(){
ctx.clearRect(0,0,W,W);
ctx.save();ctx.scale(2,1);
var g=ctx.createRadialGradient(0,0,0,0,0,756);
g.addColorStop(.07,"#244549");g.addColorStop(.5,"#00e7fd");g.addColorStop(1,"#401aac");
ctx.fillStyle=g;ctx.fillRect(0,0,W,W);ctx.restore();

ctx.strokeStyle="#000";ctx.lineWidth=6;
[[1080,520,[300,334,368,402,436,470,504]],[0,0,[100,134]]].forEach(function(s){s[2].forEach(function(r){ctx.beginPath();ctx.arc(s[0],s[1],r,0,Math.PI*2);ctx.stroke()})});

if(sygnet)ctx.drawImage(sygnet,64,60,64*136.235/99,64);

var fx=630,fy=260,fw=390,fh=420,rad=24;
ctx.save();
ctx.beginPath();ctx.roundRect(fx,fy,fw,fh,rad);ctx.clip();
if(photo){
var z=+$("zoom").value,s=Math.max(fw/photo.naturalWidth,fh/photo.naturalHeight)*z;
var iw=photo.naturalWidth*s,ih=photo.naturalHeight*s;
var ox=(iw-fw)/2*(+$("px").value),oy=(ih-fh)/2*(+$("py").value);
ctx.drawImage(photo,fx-(iw-fw)/2-ox,fy-(ih-fh)/2-oy,iw,ih);
}else{
ctx.fillStyle="rgba(0,0,0,.08)";ctx.fillRect(fx,fy,fw,fh);
ctx.fillStyle="#000";ctx.font="800 22px Nunito";ctx.textAlign="center";ctx.letterSpacing="2.6px";
ctx.fillText("[ZDJĘCIE",fx+fw/2,fy+fh/2-4);ctx.fillText("PRELEGENTA]",fx+fw/2,fy+fh/2+26);
ctx.letterSpacing="0px";ctx.textAlign="left";
}
ctx.restore();
ctx.strokeStyle="#000";ctx.lineWidth=8;
ctx.beginPath();ctx.roundRect(fx+4,fy+4,fw-8,fh-8,rad-4);ctx.stroke();

ctx.fillStyle="#000";ctx.textBaseline="alphabetic";ctx.textAlign="left";
var y=300;
ctx.font="800 56px Unbounded";ctx.letterSpacing="1.12px";
ctx.fillText("WBIJAM!",64,y+56*.9);ctx.letterSpacing="0px";

var nameFont="500 68px Jost",nm=$("name").value.trim()||"Imię Nazwisko";

ctx.letterSpacing="0px";
y+=12;
var sub=[$("role").value.trim(),$("company").value.trim()].filter(Boolean).join(" · ");

wrap(sub,subFont,540).forEach(function(l){ctx.font=subFont;ctx.fillText(l,64,y+36*.85);y+=43});

ctx.fillStyle="#fff";ctx.font="800 34px Nunito";
ctx.fillText("Kwadrat Kreatywny #3 · 26.11.2026 · SkyHub",64,850+34*.85);
if(logo)ctx.drawImage(logo,64,960,340,340*116/1169);
}

function schedule(){if(queued)return;queued=true;requestAnimationFrame(function(){queued=false;draw()})}

$("photo").addEventListener("change",function(e){
var f=e.target.files[0],err=$("err");err.textContent="";
if(!f)return;
if(!/^image\/(png|jpeg|webp)$/.test(f.type)){err.textContent="Wybierz plik JPG, PNG lub WebP.";e.target.value="";return}

if(photoUrl)URL.revokeObjectURL(photoUrl);

loadImg(photoUrl).then(function(i){photo=i;$("zoom").value=1;$("px").value=0;$("py").value=0;$("adjust").disabled=false;schedule()}).catch(function(){err.textContent="Nie udało się wczytać tego zdjęcia.";photo=null});
});

$("dl").addEventListener("click",function(){
var slug=($("name").value||"prelegent").toLowerCase().replace(/ł/g,"l").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"prelegent";
cv.toBlob(function(b){var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="kwadrat-kreatywny-"+slug+".png";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)},"image/png");
